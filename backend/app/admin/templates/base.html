<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Science Study Admin{% endblock %}</title>
  <style>
    :root { --bg:#f5f6fa; --card:#fff; --ink:#1c1e26; --muted:#6b7280; --brand:#3f51b5; --line:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    header { background:var(--brand); color:#fff; padding:14px 24px; display:flex; align-items:center; gap:24px; }
    header a { color:#fff; text-decoration:none; font-size:14px; opacity:.9; }
    header a:hover { opacity:1; text-decoration:underline; }
    header .brand { font-weight:700; font-size:17px; margin-right:auto; }
    main { max-width:1100px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
    .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .stat b { display:block; font-size:26px; }
    .stat span { color:var(--muted); font-size:13px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
    button, .btn { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:9px 14px; font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
    button.secondary { background:#e5e7eb; color:var(--ink); }
    button.danger { background:#dc2626; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .error { background:#fee2e2; color:#991b1b; padding:10px 12px; border-radius:8px; margin-bottom:12px; }
    h1 { font-size:22px; } h2 { font-size:17px; margin-top:0; }
  </style>
</head>
<body>
{% if admin is defined and admin %}
<header>
  <span class="brand">Science Study Admin</span>
  <a href="/admin">Dashboard</a>
  <a href="/admin/content">Content</a>
  <a href="/admin/questions">Questions</a>
  <a href="/admin/tests">Tests</a>
  <a href="/admin/users">Users</a>
  <a href="/docs">API docs</a>
  <a href="/admin/logout">Logout ({{ admin.name }})</a>
</header>
{% endif %}
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
